<!DOCTYPE html>
<html>
<head>
  <title>S.N Opticals</title>

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #b30000;
      color: white;
    }

    header {
      background: #800000;
      padding: 20px;
      text-align: center;
    }

    .section {
      padding: 40px 20px;
      text-align: center;
      max-width: 1100px;
      margin: auto;
    }

    .cards {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .card {
      background: #990000;
      padding: 15px;
      border-radius: 12px;
      width: 350px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    .shop-img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      border-radius: 10px;
    }

    .btn {
      display: inline-block;
      margin-top: 10px;
      padding: 8px 15px;
      background: white;
      color: red;
      border-radius: 5px;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

<header>
  <h1>S.N OPTICALS 👓</h1>
  <p>Best Opticals in Hasthinapuram and Madambakkam</p>
</header>

<div class="section">
  <h2>Our Shops</h2>

  <div class="cards">

    <!-- HASTINAPURAM -->
    <div class="card">
      <img src="shop1.jpg" class="shop-img">
      <h3>📍 Hasthinapuram Branch</h3>
      <p>Near BSNL Exchange</p>
      <a class="btn" href="https://www.google.com/maps/search/?api=1&query=S.N+Opticals+Hastinapuram" target="_blank">View Map</a>
    </div>

    <!-- MADAMBAKKAM -->
    <div class="card">
      <img src="shop2.jpg" class="shop-img">
      <h3>📍 Madambakkam Branch</h3>
      <p>Main Road</p>
      <a class="btn" href="https://www.google.com/maps/search/?api=1&query=S.N+Opticals+Madambakkam" target="_blank">View Map</a>
    </div>

  </div>
</div>

</body>
</html>
