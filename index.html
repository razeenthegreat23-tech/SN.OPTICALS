<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <!-- Important: fixes mobile sizing -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>S.N Opticals | Hasthinapuram & Madambakkam</title>

  <meta name="description" content="Visit S.N Opticals in Hasthinapuram near BSNL Exchange and Madambakkam Main Road. Find our optical shops and directions on Google Maps.">

  <meta name="theme-color" content="#b30000">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #b30000;
      color: white;
    }

    header {
      background: #800000;
      padding: 24px 16px;
      text-align: center;
    }

    header h1 {
      font-size: clamp(25px, 5vw, 38px);
      margin: 0 0 10px;
    }

    header p {
      font-size: 16px;
      line-height: 1.6;
      margin: 0;
    }

    .section {
      padding: 30px 16px 45px;
      text-align: center;
      max-width: 1100px;
      margin: 0 auto;
    }

    .section h2 {
      font-size: 28px;
      margin: 0 0 24px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 24px;
      align-items: stretch;
    }

    .card {
      min-width: 0;
      background: #990000;
      padding: 16px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    .shop-img {
      display: block;
      width: 100%;
      height: 230px;
      object-fit: cover;
      border-radius: 10px;
    }

    .card h3 {
      font-size: 21px;
      line-height: 1.4;
      margin: 16px 0 8px;
    }

    .card p {
      font-size: 16px;
      line-height: 1.5;
      margin: 8px 0;
    }

    .btn {
      display: inline-block;
      margin-top: 12px;
      padding: 12px 20px;
      background: white;
      color: #b30000;
      border-radius: 6px;
      text-decoration: none;
      font-size: 16px;
      font-weight: bold;
    }

    .btn:hover {
      background: #ffe5e5;
    }

    /* Mobile phones */
    @media (max-width: 600px) {
      header {
        padding: 22px 14px;
      }

      header h1 {
        font-size: 27px;
      }

      header p {
        font-size: 15px;
      }

      .section {
        padding: 26px 14px 36px;
      }

      .section h2 {
        font-size: 25px;
        margin-bottom: 20px;
      }

      .cards {
        grid-template-columns: 1fr;
        gap: 22px;
      }

      .card {
        width: 100%;
        padding: 14px;
      }

      .shop-img {
        height: auto;
        aspect-ratio: 4 / 3;
        object-fit: cover;
      }

      .card h3 {
        font-size: 21px;
      }

      .card p {
        font-size: 16px;
      }

      .btn {
        padding: 13px 22px;
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>S.N OPTICALS 👓</h1>
    <p>Best Opticals in Hasthinapuram and Madambakkam</p>
  </header>

  <main>
    <section class="section">
      <h2>Our Shops</h2>

      <div class="cards">

        <div class="card">
          <img
            src="shop1.jpg"
            alt="S.N. Opticals Hasthinapuram branch"
            class="shop-img"
          >

          <h3>📍 Hasthinapuram Branch</h3>
          <p>Near BSNL Exchange</p>

          <a
            class="btn"
            href="https://www.google.com/maps/search/?api=1&amp;query=S.N+Opticals+Hastinapuram"
            target="_blank"
            rel="noopener noreferrer"
          >View Map</a>
        </div>

        <div class="card">
          <img
            src="shop2.jpg"
            alt="S.N. Opticals Madambakkam branch"
            class="shop-img"
          >

          <h3>📍 Madambakkam Branch</h3>
          <p>Main Road</p>

          <a
            class="btn"
            href="https://www.google.com/maps/search/?api=1&amp;query=S.N+Opticals+Madambakkam"
            target="_blank"
            rel="noopener noreferrer"
          >View Map</a>
        </div>

      </div>
    </section>
  </main>

</body>
</html>
